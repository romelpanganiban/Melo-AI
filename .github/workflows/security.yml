name: Security Scanning

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  dependency-and-sast:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Install security tools
        run: |
          python -m pip install pip-audit bandit[toml]

      - name: Run dependency vulnerability audit
        run: |
          pip-audit -r backend/requirements.txt --progress-spinner off

      - name: Run static analysis security scan
        run: |
          bandit -r backend -q -f txt -x backend/tests -x backend/.venv
